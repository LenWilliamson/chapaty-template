[package]
name = "chapaty-template"
version = "1.3.1+1"
edition = "2024"
rust-version = "1.95.0"
publish = false

[dependencies]
anyhow = "1.0"
chapaty = "1.3.1"
chrono = "0.4"
chrono-tz = "0.10"
dirs = "6.0"
itertools = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
time = { version = "0.3", features = ["macros", "formatting"] }
tokio = "1.52"
