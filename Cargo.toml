[package]
name = "chapaty-template"
version = "1.3.5+1"
edition = "2024"
rust-version = "1.97.0"
publish = false

[dependencies]
anyhow = "1.0"
chapaty = "1.3.5"
chrono = "0.4"
chrono-tz = "0.10"
dirs = "6.0"
dotenvy = "0.15.7"
itertools = "0.15.0"
object_store = { version = "0.14.1", features = ["gcp"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
tokio = "1.53"

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"
linker_messages = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Individually opted-in restriction lints
clone_on_ref_ptr = "warn"
let_underscore_must_use = "warn"
unwrap_used = "warn"
expect_used = "warn"
future_not_send = "warn"

# Attributes & Code Discipline lints
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
